# Render Blueprint — deploy Tilt21.
# Dashboard: New → Blueprint → connect GitHub repo.
#
# After first deploy, open the tilt21-web URL on your phone.

databases:
  - name: tilt21-db
    databaseName: tilt21
    user: tilt21
    plan: free

services:
  - type: web
    name: tilt21-api
    runtime: docker
    dockerfilePath: ./packages/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    preDeployCommand: sh -c "cd packages/server && npx drizzle-kit push"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tilt21-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: tilt21-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: tilt21-web
    runtime: docker
    dockerfilePath: ./packages/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: tilt21-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: tilt21-api
          envVarKey: RENDER_EXTERNAL_URL
